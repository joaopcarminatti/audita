# Exemplo de uso da ferramenta como portão de qualidade em uma esteira de CI:
# a cada alteração no backlog, a auditoria roda sozinha e reprova o build
# se a aderência ficar abaixo da meta definida em config.json.
name: Auditoria de qualidade

on:
  push:
    paths: ['artefatos/**', 'checklists/**', 'src/**']
  pull_request:
  schedule:
    - cron: '0 12 * * 1' # toda segunda-feira, para reavaliar prazos e escalonar

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes da ferramenta
        run: npm test

      - name: Auditoria dos artefatos
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node audita.js auditar --exigir-meta

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-auditoria
          path: relatorios/ultimo-relatorio.html

      - name: Explicar o resultado do portão
        if: always()
        run: |
          META=$(node -p "require('./config.json').metaAderencia")
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Por que este build fica vermelho

          Os artefatos em \`artefatos/\` contêm **defeitos propositais**: eles existem para
          demonstrar a ferramenta encontrando não-conformidades reais, e não para passar na
          auditoria.

          O passo \`node audita.js auditar --exigir-meta\` funciona como **portão de qualidade**:
          ele reprova o build sempre que a aderência global fica abaixo da meta de **${META}%**
          definida em \`config.json\`.

          Portanto, **a falha deste job é o comportamento esperado** — é a prova de que o portão
          está ativo e cumprindo sua função. Não se trata de erro de execução da ferramenta.

          O relatório completo da auditoria (aderência por artefato e por categoria, lista de NCs
          com evidência, severidade, responsável e prazo) está publicado no artefato
          **relatorio-auditoria** desta execução.
          EOF
